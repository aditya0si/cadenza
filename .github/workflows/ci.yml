name: ci

# The same gate commands the author runs locally, in the same order:
#   npm run lint -> npm run typecheck -> npm run test -> npm run build -> npm run e2e
# Nothing is allowed to fail silently: there is no `continue-on-error`, no
# `|| true`, and no test deselection anywhere in this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'lint, typecheck, test, build, e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mongodb-memory-server downloads a real mongod on first use; caching the
      # binary keeps CI under a minute instead of re-downloading ~780 MB.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.2.6-${{ runner.os }}

      - name: Lint with eslint, zero warnings allowed
        run: npm run lint

      - name: Typecheck with tsc --noEmit for both workspaces
        run: npm run typecheck

      - name: Run the vitest suites for unit, integration and realtime sockets
        run: npm run test

      - name: Production build for the API and the web client
        run: npm run build

      - name: End-to-end smoke against the built API
        run: npm run e2e

      - name: Secret scan over the tracked tree
        run: |
          matches=$(git grep -nIE '(api[_-]?key|secret|password|token|mongodb\+srv)\s*[:=]' -- . \
            ':!*.example' ':!package-lock.json' ':!*.md' || true)
          echo "$matches"
          if echo "$matches" | grep -vE 'MEDIA_SIGNING_SECRET|CLERK_SECRET_KEY|CLERK_WEBHOOK_SECRET|DEMO_AUTH_SECRET|secretKey|signingSecret|secret: null|TEST_WEBHOOK|WEBHOOK_SECRET|SECRET =|SECRET:|redact|tokens?\b|seed-|windowMs' | grep -q .; then
            echo "::error::Possible committed secret found by git grep"
            exit 1
          fi
          echo "secret scan clean"

  # The latency probe is a measurement, not a pass/fail gate, so it lives behind
  # workflow_dispatch: it boots the API and pushes 220 events per channel to
  # reproduce the p50/p95 table quoted in README.md.
  latency:
    name: 'realtime latency probe, manual dispatch only'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.2.6-${{ runner.os }}
      - run: npm run build
      - name: Measure propagation latency
        run: npm run latency
